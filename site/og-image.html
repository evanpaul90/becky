<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Space+Mono:wght@700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
    background:radial-gradient(circle at 20% 18%,rgba(176,75,255,.35),transparent 42%),
               radial-gradient(circle at 84% 80%,rgba(46,123,255,.32),transparent 45%),#14111d;
    font-family:'Comic Neue',sans-serif;}
  .halftone{position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2.2px);
    background-size:20px 20px;}
  .frame{position:absolute;inset:34px;border:7px solid #14111d;border-radius:26px;
    box-shadow:18px 18px 0 rgba(0,0,0,.45),inset 0 0 0 5px #f6edd6;background:transparent;}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;}
  .tag{font-family:'Space Mono',monospace;font-weight:700;font-size:18px;letter-spacing:.3em;
    background:#ffd23f;color:#14111d;padding:8px 18px;border:4px solid #14111d;transform:rotate(-2deg);box-shadow:6px 6px 0 #14111d;}
  h1{font-family:'Bangers';font-size:240px;line-height:.8;color:#ffd23f;
    -webkit-text-stroke:8px #14111d;paint-order:stroke fill;text-shadow:16px 16px 0 #ff2e54;letter-spacing:6px;margin:18px 0 6px;}
  .sub{font-family:'Bangers';font-size:44px;letter-spacing:5px;color:#fff;-webkit-text-stroke:2px #14111d;paint-order:stroke fill;}
  .badges{display:flex;gap:14px;margin-top:26px;}
  .badge{width:66px;height:66px;border-radius:50%;border:5px solid #14111d;display:flex;align-items:center;justify-content:center;box-shadow:6px 6px 0 rgba(0,0,0,.4);background:#1d1830;}
  .badge svg{width:66%;height:66%}
  .author{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-family:'Space Mono',monospace;font-weight:700;font-size:18px;letter-spacing:.14em;color:#f6edd6;opacity:.85;z-index:2;}
  .pow{position:absolute;top:70px;right:80px;font-family:'Bangers';font-size:40px;color:#fff;background:#ff2e54;border:5px solid #14111d;padding:8px 20px 4px;transform:rotate(8deg);box-shadow:6px 6px 0 #14111d;z-index:3;letter-spacing:2px;}
</style>
</head>
<body>
<div class="halftone"></div>
<div class="frame"></div>
<div class="pow">15 HEROES!</div>
<div class="wrap">
  <span class="tag">MULTI-AGENT CODING OS</span>
  <h1>BECKY</h1>
  <div class="sub">SHIP WHILE YOU SLEEP</div>
  <div class="badges" id="b"></div>
</div>
<div class="author">becky-os.netlify.app &middot; v2.0</div>
<script>
const E={
 fury:['#ff2e54','<path d="M8 50 Q50 16 92 50 Q50 84 8 50 Z"/><circle cx="50" cy="50" r="15" fill="currentColor" stroke="none"/>'],
 strange:['#b04bff','<circle cx="50" cy="50" r="9"/><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="36"/>'],
 stark:['#ffd23f','<circle cx="50" cy="50" r="36"/><circle cx="50" cy="50" r="22"/><path d="M50 40 L60 56 H40 Z" fill="currentColor" stroke="none"/>'],
 heimdall:['#21d4fd','<ellipse cx="50" cy="48" rx="20" ry="13"/><circle cx="50" cy="48" r="6" fill="currentColor" stroke="none"/><path d="M14 80 Q50 62 86 80"/>'],
 parker:['#ff5a36','<circle cx="50" cy="50" r="5" fill="currentColor" stroke="none"/><path d="M50 50 L50 10 M50 50 L84 32 M50 50 L84 70 M50 50 L50 90 M50 50 L16 70 M50 50 L16 32"/><path d="M50 24 L70 38 L70 62 L50 78 L30 62 L30 38 Z"/>'],
 quill:['#2e7bff','<path d="M50 14 l10 22 24 3 -18 16 5 24 -21 -12 -21 12 5 -24 -18 -16 24 -3 Z" fill="currentColor" stroke="none"/>'],
};
document.getElementById('b').innerHTML=Object.values(E).map(([c,p])=>
 `<div class="badge" style="color:${c}"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">${p}</svg></div>`).join('');
</script>
</body>
</html>
